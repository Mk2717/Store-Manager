[package]
name = "cflex-store-manager"
version = "1.0.0"
description = "Native desktop and mobile shell for C.Flex Store Manager"
authors = ["C.Flex"]
edition = "2021"

[lib]
name = "cflex_store_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
