name: Build native desktop packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native-desktop.yml"
  push:
    tags:
      - "native-v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system libraries
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Generate native icons
        working-directory: native
        run: cargo tauri icon assets/cflex-native-icon.svg
      - name: Build native package
        working-directory: native
        run: cargo tauri build
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: cflex-store-manager-${{ matrix.artifact }}
          path: |
            native/target/release/bundle/**/*.deb
            native/target/release/bundle/**/*.AppImage
            native/target/release/bundle/**/*.msi
            native/target/release/bundle/**/*.exe
            native/target/release/bundle/**/*.dmg
            native/target/release/bundle/**/*.app/**
          if-no-files-found: error
