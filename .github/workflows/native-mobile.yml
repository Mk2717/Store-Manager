name: Build native mobile packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native-mobile.yml"

permissions:
  contents: read

concurrency:
  group: native-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Linux and Android build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install Tauri CLI and Android Rust targets
        run: |
          cargo install tauri-cli --version "^2" --locked
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - name: Generate icons and Android project
        working-directory: native
        run: |
          cargo tauri icon assets/cflex-native-icon.svg
          cargo tauri android init --ci
      - name: Build Android test APK
        working-directory: native
        run: cargo tauri android build --debug --apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: cflex-store-manager-android-apk
          path: native/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  ios-signed:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    environment: ios-production
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check required Apple signing secrets
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          missing=0
          for value in \
            "$APPLE_DEVELOPMENT_TEAM" \
            "$APPLE_API_KEY_ID" \
            "$APPLE_API_ISSUER" \
            "$IOS_CERTIFICATE_P12_BASE64" \
            "$IOS_CERTIFICATE_PASSWORD" \
            "$IOS_PROVISIONING_PROFILE_BASE64" \
            "$APPLE_API_PRIVATE_KEY_BASE64"
          do
            if [ -z "$value" ]; then missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "One or more required ios-production secrets are missing. See native/README.md."
            exit 1
          fi
      - name: Install Tauri CLI and iOS Rust target
        run: |
          cargo install tauri-cli --version "^2" --locked
          rustup target add aarch64-apple-ios
      - name: Import Apple signing identity and provisioning profile
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/cflex-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          CERTIFICATE_PATH="$RUNNER_TEMP/cflex-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/cflex.mobileprovision"

          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          PROFILE_UUID="$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"

          echo "CFLEX_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "CFLEX_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
      - name: Generate icons and iOS project
        working-directory: native
        run: |
          cargo tauri icon assets/cflex-native-icon.svg
          cargo tauri ios init --ci
      - name: Build signed App Store IPA
        working-directory: native
        run: cargo tauri ios build --ci --export-method app-store-connect --build-number "${{ github.run_number }}"
      - name: Upload signed iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: cflex-store-manager-ios-signed-ipa
          path: native/gen/apple/build/**/*.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary Apple signing material
        if: always()
        run: |
          if [ -n "${CFLEX_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$CFLEX_PROFILE_UUID.mobileprovision"
          fi
          rm -rf "$HOME/.appstoreconnect/private_keys"
          if [ -n "${CFLEX_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$CFLEX_KEYCHAIN_PATH" || true
          fi
